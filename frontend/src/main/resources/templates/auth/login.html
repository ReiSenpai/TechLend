<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - TechLend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="scroll-animate bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h2 class="text-3xl font-extrabold text-center text-indigo-900 mb-6">TechLend</h2>
        
        <!-- Conexión al backend: Endpoint de Spring Security -->
        <form th:action="@{/api/auth/login}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Correo Institucional</label>
                <input type="email" name="username" class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-indigo-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Contraseña</label>
                <input type="password" name="password" class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-indigo-500" required>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-indigo-700 transition">Ingresar</button>
        </form>
        
        <p class="mt-4 text-center text-sm text-slate-500">
            ¿Eres estudiante o docente? <a th:href="@{/registro}" class="text-indigo-600 font-bold hover:underline">Regístrate aquí</a>
        </p>
    </div>
    <script th:src="@{/js/scroll-animation.js}"></script>
</body>
</html>
