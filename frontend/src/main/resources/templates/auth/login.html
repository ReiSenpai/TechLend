<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - TechLend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="scroll-animate bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h2 class="text-3xl font-extrabold text-center text-indigo-900 mb-6">TechLend</h2>
        <!-- Alerta de Error -->
        <div th:if="${param.error}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4" role="alert">
            <p class="font-bold">Error de acceso</p>
            <p>Credenciales incorrectas. Verifica tu correo y contraseña.</p>
        </div>
        <!-- Conexión al backend: Endpoint de Spring Security -->
        <!-- Fíjate en el th:action y el method -->
        <form th:action="@{/login}" method="POST" class="space-y-4">

            <div>
                <label class="block text-slate-700 font-bold mb-2">Correo Institucional</label>
                <!-- El atributo 'name' es vital -->
                <input type="email" name="correoInstitucional" required
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-slate-700 font-bold mb-2">Contraseña</label>
                <!-- El atributo 'name' es vital -->
                <input type="password" name="password" required
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition">
                Ingresar
            </button>
        </form>

        <p class="mt-4 text-center text-sm text-slate-500">
            ¿Eres estudiante o docente? <a th:href="@{/registro}"
                class="text-indigo-600 font-bold hover:underline">Regístrate aquí</a>
        </p>
    </div>
    <script th:src="@{/js/scroll-animation.js}"></script>
</body>

</html>
