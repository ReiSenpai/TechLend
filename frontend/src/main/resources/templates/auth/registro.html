<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - TechLend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="scroll-animate bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h2 class="text-3xl font-extrabold text-center text-indigo-900 mb-6">Crear Cuenta</h2>
        <p class="text-center text-slate-500 mb-6 text-sm">Regístrate para solicitar equipos tecnológicos.</p>
        <!-- Alerta de Error -->
        <div th:if="${param.error}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4" role="alert">
            <p class="font-bold">Error de registro</p>
            <p>El correo ingresado ya se encuentra registrado o los datos son inválidos.</p>
        </div>
        <!-- Formulario conectado a POST /registro en AuthController -->
        <form th:action="@{/registro}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Nombres Completos</label>
                <input type="text" name="nombres" class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-indigo-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Correo Institucional</label>
                <input type="email" name="correoInstitucional" class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-indigo-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Contraseña</label>
                <input type="password" name="password" class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-indigo-500" required>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-indigo-700 transition">Registrarse</button>
        </form>
        
        <p class="mt-4 text-center text-sm text-slate-500">
            ¿Ya tienes cuenta? <a th:href="@{/login}" class="text-indigo-600 font-bold hover:underline">Inicia sesión</a>
        </p>
    </div>
    <script th:src="@{/js/scroll-animation.js}"></script>
</body>
</html>
