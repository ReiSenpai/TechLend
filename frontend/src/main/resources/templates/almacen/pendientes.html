<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-50">
    <nav class="bg-teal-600 text-white p-4 sticky top-0 shadow-md">
        <div class="container mx-auto flex justify-between">
            <h1 class="text-xl font-bold">TechLend | Almacén</h1>
            <div class="space-x-4">
                <a th:href="@{/almacen/pendientes}" class="underline">Pendientes</a>
                <a th:href="@{/almacen/devoluciones}" class="hover:text-teal-200">Devoluciones</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4">
        <section class="scroll-hidden bg-white p-6 rounded-2xl shadow-md">
            <h2 class="text-2xl font-bold text-teal-800 mb-4">Solicitudes por Aprobar</h2>
            <table class="w-full text-left">
                <thead class="bg-slate-100 text-slate-600">
                    <tr><th>Solicitante</th><th>Equipo</th><th>Fecha Prevista</th><th>Acción</th></tr>
                </thead>
                <tbody>
                    <tr th:each="prestamo : ${prestamosPendientes}" class="border-b">
                        <td class="p-4" th:text="${prestamo.solicitante.nombres}">Nombre</td>
                        <td class="p-4" th:text="${prestamo.equipo.marcaModelo}">Equipo</td>
                        <td class="p-4" th:text="${prestamo.fechaSolicitud}">Fecha</td>
                        <td class="p-4 flex gap-2">
                            <!-- Conecta con PUT /api/prestamos/{id}/aprobar -->
                            <form th:action="@{/api/prestamos/{id}/aprobar(id=${prestamo.id})}" method="POST">
                                <input type="hidden" name="_method" value="PUT">
                                <button class="bg-green-500 text-white px-3 py-1 rounded">Aprobar Entrega</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <script th:src="@{/js/scroll-animation.js}"></script>
</body>
</html>
