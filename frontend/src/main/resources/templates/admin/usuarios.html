<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-50">
    <nav class="bg-slate-900 text-white p-4 sticky top-0 shadow-md">
        <div class="container mx-auto flex justify-between">
            <h1 class="text-xl font-bold">TechLend | Admin</h1>
            <div class="space-x-4">
                <a th:href="@{/admin/dashboard}" class="hover:text-slate-300">Dashboard</a>
                <a th:href="@{/admin/usuarios}" class="underline">Gestión Usuarios</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4">
        <section class="scroll-hidden bg-white p-8 rounded-2xl shadow-md max-w-2xl mx-auto border border-slate-100">
            <h2 class="text-2xl font-bold mb-6 text-slate-800">Registrar Personal del Sistema</h2>
            
            <!-- Conecta con el backend para crear usuarios con roles específicos -->
            <form th:action="@{/api/admin/usuarios/registro}" method="POST" class="space-y-4">
                <input type="text" name="nombres" placeholder="Nombres Completos" class="w-full border p-3 rounded" required>
                <input type="email" name="correo" placeholder="Correo Institucional" class="w-full border p-3 rounded" required>
                <select name="rol" class="w-full border p-3 rounded text-slate-600" required>
                    <option value="ENCARGADO">Encargado de Almacén</option>
                    <option value="ADMINISTRADOR">Administrador</option>
                </select>
                <input type="password" name="password" placeholder="Contraseña Temporal" class="w-full border p-3 rounded" required>
                
                <button type="submit" class="w-full bg-slate-900 text-white font-bold py-3 rounded hover:bg-slate-800">Registrar Usuario</button>
            </form>
        </section>
    </main>
    <script th:src="@{/js/scroll-animation.js}"></script>
</body>
</html>
