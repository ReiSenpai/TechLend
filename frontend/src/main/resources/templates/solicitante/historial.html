<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Historial - TechLend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-50 min-h-screen">
    <nav class="bg-indigo-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between">
            <h1 class="text-xl font-bold">TechLend | Solicitante</h1>
            <div class="space-x-4">
                <a th:href="@{/solicitante/dashboard}" class="hover:text-indigo-200">Equipos</a>
                <a th:href="@{/solicitante/historial}" class="font-semibold underline">Mi Historial</a>
                <a th:href="@{/logout}" class="hover:text-red-300">Salir</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4">
        <section class="scroll-hidden bg-white p-6 rounded-2xl shadow-md border border-slate-100">
            <h2 class="text-2xl font-bold text-indigo-900 mb-6">Historial de Préstamos</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-100 text-slate-600 uppercase text-sm">
                        <tr>
                            <th class="p-4 border-b">Equipo</th>
                            <th class="p-4 border-b">Fecha Solicitud</th>
                            <th class="p-4 border-b">Fecha Devolución</th>
                            <th class="p-4 border-b">Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Iteración sobre la lista 'historial' enviada por el controlador -->
                        <tr th:each="prestamo : ${historial}" class="hover:bg-slate-50 transition border-b">
                            <td class="p-4 font-medium text-slate-800" th:text="${prestamo.equipo.marcaModelo}">Laptop Lenovo</td>
                            <td class="p-4 text-slate-600" th:text="${prestamo.fechaSolicitud}">2026-05-10</td>
                            <td class="p-4 text-slate-600" th:text="${prestamo.fechaEntrega}">2026-05-11</td>
                            <td class="p-4">
                                <span class="px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-800" th:text="${prestamo.estado}">DEVUELTO</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script th:src="@{/js/scroll-animation.js}"></script>
</body>
</html>
