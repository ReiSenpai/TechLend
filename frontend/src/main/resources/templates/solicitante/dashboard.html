<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-50 min-h-screen">
    <nav class="bg-indigo-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between">
            <h1 class="text-xl font-bold">TechLend | Solicitante</h1>
            <div class="space-x-4">
                <a th:href="@{/solicitante/dashboard}" class="font-semibold underline">Equipos</a>
                <a th:href="@{/solicitante/historial}" class="hover:text-indigo-200">Mi Historial</a>
                <a th:href="@{/logout}" class="hover:text-red-300">Salir</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4">
        <section class="scroll-hidden mb-8 text-center">
            <h2 class="text-3xl font-bold text-slate-800">Equipos Disponibles</h2>
            <p class="text-slate-500">Selecciona el equipo, fecha y hora de uso para generar una solicitud pendiente.</p>
        </section>

        <!-- Grid conectado al Backend -->
        <section class="scroll-hidden grid grid-cols-1 md:grid-cols-3 gap-6">
            <div th:each="equipo : ${equipos}" class="bg-white p-6 rounded-xl shadow-md border border-slate-100">
                <h4 class="text-xl font-bold" th:text="${equipo.marcaModelo}">Laptop HP</h4>
                <p class="text-sm text-slate-500 mb-4" th:text="${equipo.codigoPatrimonial}">Código</p>
                
                <!-- Formulario conectado a POST /api/prestamos -->
                <form th:action="@{/api/prestamos}" method="POST">
                    <input type="hidden" name="equipoId" th:value="${equipo.id}">
                    <input type="datetime-local" name="fechaSolicitud" class="w-full mb-4 border p-2 rounded" required>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Solicitar</button>
                </form>
            </div>
        </section>
    </main>
    <script th:src="@{/js/scroll-animation.js}"></script>
</body>
</html>
