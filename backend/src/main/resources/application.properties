spring.application.name=backend
server.port=8090

# Configuración de Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techlend_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root2003

# Configuración de Hibernate (Crea o actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Deshabilitar el inicio de sesión por defecto de Spring Security
spring.security.user.name=admin
spring.security.user.password=admin