<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGIE - Mi Historial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { utpRed: '#8b0000', bgMain: '#F4F4F6' } } }
        }
    </script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-bgMain text-gray-800 h-screen flex flex-col">

    <!-- Navbar -->
    <header class="h-14 bg-white border-b border-gray-200 flex items-center px-5 justify-between z-10 flex-shrink-0">
        <div class="flex items-center gap-3.5">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 bg-utpRed rounded-md flex items-center justify-center">
                    <span class="text-white font-bold text-xs">::</span>
                </div>
                <span class="font-bold text-gray-900 text-sm">SGIE</span>
            </div>
            <span class="text-xs text-gray-400 hidden md:block">· Sistema de Gestión de Inventario y Equipos · FISE UTP</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 pl-3 border-l border-gray-200">
                <div class="w-7 h-7 bg-utpRed rounded-full flex items-center justify-center text-white text-[10px] font-bold">CQ</div>
                <div>
                    <div class="text-xs font-semibold text-gray-800" id="user-name">Cargando...</div>
                    <div class="text-[10px] text-gray-400">Solicitante</div>
                </div>
            </div>
            <button onclick="logout()" class="text-xs text-gray-400 hover:text-gray-700 px-2 py-1 hover:bg-gray-100 rounded">Salir</button>
        </div>
    </header>

    <div class="bg-white border-b flex px-6 text-sm">
        <a href="catalogo.html" class="py-3 px-4 text-gray-500 hover:text-gray-900 font-medium transition-colors">Equipos Disponibles</a>
        <a href="#" class="py-3 px-4 text-utpRed border-b-2 border-utpRed font-semibold">Mi Historial</a>
    </div>

    <!-- Contenido -->
    <main class="flex-1 overflow-auto p-6 max-w-7xl mx-auto w-full">
        <div class="mb-6">
            <h1 class="text-xl font-bold text-gray-900">Mis Préstamos e Historial</h1>
            <p class="text-sm text-gray-500 mt-0.5">Seguimiento de tus solicitudes y devoluciones</p>
        </div>

        <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm min-w-[600px]">
                    <thead>
                        <tr class="border-b border-gray-100 bg-gray-50/50">
                            <th class="text-left px-4 py-3 text-[10px] font-semibold text-gray-400 uppercase tracking-widest whitespace-nowrap">Solicitud</th>
                            <th class="text-left px-4 py-3 text-[10px] font-semibold text-gray-400 uppercase tracking-widest whitespace-nowrap">Equipo</th>
                            <th class="text-left px-4 py-3 text-[10px] font-semibold text-gray-400 uppercase tracking-widest whitespace-nowrap">Fecha inicio</th>
                            <th class="text-left px-4 py-3 text-[10px] font-semibold text-gray-400 uppercase tracking-widest whitespace-nowrap">Fecha devolución</th>
                            <th class="text-left px-4 py-3 text-[10px] font-semibold text-gray-400 uppercase tracking-widest whitespace-nowrap">Motivo</th>
                            <th class="text-left px-4 py-3 text-[10px] font-semibold text-gray-400 uppercase tracking-widest whitespace-nowrap">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-historial">
                        <!-- Llenado por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('user-name').textContent = localStorage.getItem('sgie_nombres') || 'Usuario';
        
        // Simulación de carga de datos mediante tu API
        async function cargarHistorial() {
            try {
                // Endpoint real: const res = await fetchAutenticado('http://localhost:8090/api/prestamos/mis-prestamos');
                // const data = await res.json();
                
                // Data simulada basada en tu componente React
                const data = [
                    { id: 'SOL-001', equipo: 'Lenovo ThinkPad X1 Carbon', codigo: 'LAP-002', inicio: '2026-07-18', fin: '2026-07-22', motivo: 'Proyecto de investigación IoT', estado: 'Pendiente', bg: 'bg-amber-50', text: 'text-amber-700' },
                    { id: 'SOL-003', equipo: 'Canon EOS Rebel SL3', codigo: 'CAM-001', inicio: '2026-07-17', fin: '2026-07-18', motivo: 'Proyecto de tesis', estado: 'Aprobado', bg: 'bg-emerald-50', text: 'text-emerald-700' },
                    { id: 'SOL-005', equipo: 'Epson PowerLite 1781W', codigo: 'PRO-001', inicio: '2026-07-10', fin: '2026-07-12', motivo: 'Presentación de proyecto', estado: 'Devuelto', bg: 'bg-gray-100', text: 'text-gray-600' }
                ];

                const tbody = document.getElementById('tabla-historial');
                tbody.innerHTML = data.map(r => `
                    <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
                        <td class="px-4 py-3.5 font-mono text-xs text-gray-400">${r.id}</td>
                        <td class="px-4 py-3.5">
                            <div class="font-medium text-gray-900 text-xs">${r.equipo}</div>
                            <div class="text-[10px] text-gray-400 font-mono">${r.codigo}</div>
                        </td>
                        <td class="px-4 py-3.5 text-xs text-gray-500 tabular-nums">${r.inicio}</td>
                        <td class="px-4 py-3.5 text-xs text-gray-500 tabular-nums">${r.fin}</td>
                        <td class="px-4 py-3.5 text-xs text-gray-500 max-w-[140px] truncate" title="${r.motivo}">${r.motivo}</td>
                        <td class="px-4 py-3.5">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${r.bg} ${r.text}">${r.estado}</span>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error("Error al cargar historial", error);
            }
        }
        cargarHistorial();
        
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
