<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Equipos - Admin UTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#F4F4F6] min-h-screen flex text-gray-800">

    <!-- Menú Lateral -->
    <aside class="w-64 bg-[#8B0000] text-white flex flex-col hidden md:flex">
        <div class="p-6">
            <h1 class="text-xl font-bold tracking-wider">FISE Admin</h1>
            <p class="text-xs text-red-200 mt-1">Gestión de Inventario</p>
        </div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="#" class="block px-4 py-3 bg-white/10 rounded-xl text-sm font-semibold">📦 Equipos</a>
            <a href="admin-sanciones.html" class="block px-4 py-3 text-red-100 hover:bg-white/5 rounded-xl text-sm transition-colors">⚠️ Sanciones</a>
        </nav>
        <div class="p-4 border-t border-red-800">
            <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-200 hover:text-white transition-colors">Cerrar Sesión</button>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 p-8 overflow-y-auto">
        
        <header class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Inventario de Equipos</h2>
                <p class="text-sm text-gray-500 mt-1">Administra el catálogo patrimonial de la facultad.</p>
            </div>
            <button onclick="abrirModal()" class="bg-[#8B0000] text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-[#6e0000] shadow-sm">
                + Registrar Equipo
            </button>
        </header>

        <!-- Tabla de Equipos -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50/50 border-b border-gray-100">
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Código Patrimonial</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Equipo / Modelo</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Categoría</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-equipos" class="divide-y divide-gray-100">
                        <!-- Las filas se llenarán con JavaScript desde la BD -->
                        <tr>
                            <td colspan="4" class="px-6 py-8 text-center text-gray-400">Cargando inventario...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal para Registrar Equipo -->
    <div id="modal-equipo" class="fixed inset-0 bg-gray-900/50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-900">Registrar Nuevo Equipo</h3>
                <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="form-registro" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Código Patrimonial</label>
                    <input type="text" id="codigoPatrimonial" required placeholder="Ej: LAP-015" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#8B0000]">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Tipo de Equipo</label>
                    <input type="text" id="tipo" required placeholder="Ej: Laptop" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#8B0000]">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Marca y Modelo</label>
                    <input type="text" id="marcaModelo" required placeholder="Ej: Dell Inspiron 15" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#8B0000]">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Categoría (ID Base de datos)</label>
                    <select id="categoriaId" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#8B0000]">
                        <option value="1">1 - Laptops</option>
                        <option value="2">2 - Proyectores</option>
                        <option value="3">3 - Tablets</option>
                        <option value="4">4 - Cámaras</option>
                        <option value="5">5 - Kits Arduino</option>
                    </select>
                </div>
                
                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">Cancelar</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-[#8B0000] rounded-lg hover:bg-[#6e0000]">Guardar Equipo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarEquipos();
        });

        // 1. Obtener los equipos desde MySQL
        async function cargarEquipos() {
            try {
                const equipos = await apiFetch('/equipos');
                const tbody = document.getElementById('tabla-equipos');
                
                if (!equipos || equipos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">No hay equipos registrados</td></tr>`;
                    return;
                }

                tbody.innerHTML = equipos.map(e => `
                    <tr class="hover:bg-gray-50/50 transition-colors">
                        <td class="px-6 py-4 font-mono text-sm font-medium text-gray-900">${e.codigoPatrimonial}</td>
                        <td class="px-6 py-4">
                            <div class="font-medium text-sm text-gray-900">${e.marcaModelo}</div>
                            <div class="text-xs text-gray-500">${e.tipo}</div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-600">${e.categoria ? e.categoria.nombre : 'Sin categoría'}</td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 text-[11px] font-bold rounded-full uppercase tracking-wide
                                ${e.estadoActual === 'Disponible' ? 'bg-emerald-100 text-emerald-800' : 
                                  e.estadoActual === 'Prestado' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800'}">
                                ${e.estadoActual}
                            </span>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error("Error cargando equipos:", error);
            }
        }

        // 2. Lógica del Modal
        function abrirModal() {
            document.getElementById('modal-equipo').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-equipo').classList.add('hidden');
            document.getElementById('form-registro').reset();
        }

        // 3. Enviar nuevo equipo por POST a Spring Boot
        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Construimos el JSON tal como lo espera Spring Boot
            const nuevoEquipo = {
                codigoPatrimonial: document.getElementById('codigoPatrimonial').value,
                tipo: document.getElementById('tipo').value,
                marcaModelo: document.getElementById('marcaModelo').value,
                categoria: { 
                    id: parseInt(document.getElementById('categoriaId').value) 
                }
            };

            try {
                await apiFetch('/equipos', {
                    method: 'POST',
                    body: JSON.stringify(nuevoEquipo)
                });
                
                alert('Equipo registrado correctamente.');
                cerrarModal();
                cargarEquipos(); // Recarga la tabla para mostrar el nuevo registro
                
            } catch (error) {
                alert('Error al registrar: ' + error.message);
            }
        });

        function logout() { 
            localStorage.clear(); 
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
